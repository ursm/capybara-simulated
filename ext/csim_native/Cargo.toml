# capybara-simulated's native extension: the V8 engine (rusty_racer, linked as a
# library) + the native DOM, built into ONE cdylib. The hot DOM accessors must
# share the same V8 as the engine, and two separately-linked .so files would each
# bake their own V8 runtime (unsound to share an isolate across them) — so the DOM
# lives here, in the same cdylib, rather than in a second extension. rusty_racer
# stays a pure V8 binding and is reached only through its generic realm-init hook.
[package]
name = "csim_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rusty_racer as a LIBRARY (not its gem .so): we call install_classes from our own
# magnus init and register the DOM via set_realm_init_hook. Path dep during
# development; a git/tagged dep at release time.
rusty_racer = { path = "../../../rusty_racer/ext/rusty_racer" }
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
# MUST match rusty_racer's v8 exactly (version + features) so Cargo unifies to one
# V8; a mismatch would link two runtimes.
v8 = { version = "150.4.0", features = ["simdutf"] }

# Native CSS selector matching over the arena: Servo's production engine (the same
# selectors/cssparser Firefox ships), so tree-structural matching is correct by
# construction. Ported from the unmerged native-selector-matching branch, repointed
# from a JSON mirror at the live arena.
selectors = "0.40"
cssparser = "0.37"
precomputed-hash = "0.1"

# The style engine: Servo's stylo (Firefox's style system), over the arena as its DOM. It shares cssparser and
# selectors with the matcher above, so a selector compiled for a query and one in a stylesheet are the same kind.
stylo = "0.21"
stylo_dom = "0.21"
stylo_traits = "0.21"
stylo_static_prefs = "0.21"
stylo_atoms = "0.21"
web_atoms = "0.2"
euclid = "0.22"
app_units = "0.7"
url = "2.5"
# The URL parser the page's `URL` and every URL it resolves are parsed by (url_ops.rs): Ada, Node.js's — it passes the
# URL Standard's tests, where `url` (above, Servo's, which stylo resolves its sheets' URLs with) fails some 300. And the
# legacy encodings HTML's "encoding-parse a URL" percent-encodes a query in: every WHATWG encoding, multibyte included.
ada-url = "4"
encoding_rs = "0.8"
bitflags = "2"

# An `<input>`'s `pattern` is an ECMAScript regular expression (compiled with the `v` flag): regress is a JS-syntax
# engine in pure Rust (Boa's), matched over UTF-16 as a page's string is (validity.rs).
regress = { version = "0.12", features = ["utf16"] }

# Native text metrics for native layout (stage L2): fontations (the pure-Rust font stack Chrome & Servo
# use). `skrifa` reads a font's cmap + hmtx advances + metrics, so native inline layout measures runs +
# breaks lines IN-PROCESS (no per-run V8 crossing). Re-exports read-fonts as `skrifa::raw`.
skrifa = "0.31"

# The Unicode general categories the ORACLE asks a regex for (`\p{L}` / `\p{N}` / `\p{M}`) — the classes
# `layout::hyphen_breaks_after` and `font::zero_width` have to agree with it about. regex-syntax bakes in a
# UCD snapshot of its own, so its answers are CHECKED against the driver's own engine (native_layout_text_spec)
# rather than assumed. `unicode-gencat` is the narrowest feature that answers them — it brings all 38 general
# categories plus the property name/value tables — and it is also the ONLY one enabled, so a pattern outside
# `\p{<general category>}` does not parse: `\p{Alphabetic}`, `\p{Script=Hebrew}` and `\w` would all reach
# `unicode.rs`'s panic. Porting something that needs one means enabling its feature here first.
regex-syntax = { version = "0.8", default-features = false, features = ["unicode-gencat"] }
# …and the Bidi_Class HTML's `dir=auto` scans text by (a "strong directional character" is L, R or AL): ICU4X's
# compiled data, which `url`'s IDNA links in already.
icu_properties = "2"
# The text of the generated boxes a walk meets, allocated as it meets them and read back for the rest of the walk
# (`walk::Generated`): an arena hands out references from `&self`.
typed-arena = "2"
# A number as script writes it (ECMAScript Number::toString): Ryu with the JS formatting rules, V8's own shortest digits
# (numbers.rs).
ryu-js = "1"
# What a canvas path op adds before it is written into the page's array (canvas_path.rs `Builder`): a point or a few,
# held inline — a path is built one call per point, and a heap allocation each costs more than the op.
smallvec = "1"
# A canvas serialised as a file (image_encode.rs: toDataURL / toBlob / the screenshot): PNG, JPEG and lossless WebP,
# pure Rust, so no system image library is needed at run time; and the Display P3 profile a P3 canvas's file carries
# (moxcms, ICC colour management).
moxcms = "0.9"
png = "0.18"
jpeg-encoder = "0.7"
image-webp = "0.2"

# The HTML parser: Servo's html5ever — tokenizer and tree builder, the select parser relaxation and `selectedcontent`
# included — run natively, the page side taking the tree it builds as steps (html_parse.rs).
html5ever = "0.40"

