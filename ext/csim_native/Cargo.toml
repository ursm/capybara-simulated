# capybara-simulated's native extension: the V8 engine (rusty_racer, linked as a
# library) + the native DOM, built into ONE cdylib. The hot DOM accessors must
# share the same V8 as the engine, and two separately-linked .so files would each
# bake their own V8 runtime (unsound to share an isolate across them) — so the DOM
# lives here, in the same cdylib, rather than in a second extension. rusty_racer
# stays a pure V8 binding and is reached only through its generic realm-init hook.
[package]
name = "csim_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rusty_racer as a LIBRARY (not its gem .so): we call install_classes from our own
# magnus init and register the DOM via set_realm_init_hook. Path dep during
# development; a git/tagged dep at release time.
rusty_racer = { path = "../../../rusty_racer/ext/rusty_racer" }
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
# MUST match rusty_racer's v8 exactly (version + features) so Cargo unifies to one
# V8; a mismatch would link two runtimes.
v8 = { version = "150.4.0", features = ["simdutf"] }

# Native CSS selector matching over the arena: Servo's production engine (the same
# selectors/cssparser Firefox ships), so tree-structural matching is correct by
# construction. Ported from the unmerged native-selector-matching branch, repointed
# from a JSON mirror at the live arena.
selectors = "0.40"
cssparser = "0.37"
precomputed-hash = "0.1"

# Native text metrics for native layout (stage L2): fontations (the pure-Rust font stack Chrome & Servo
# use). `skrifa` reads a font's cmap + hmtx advances + metrics, so native inline layout measures runs +
# breaks lines IN-PROCESS (no per-run V8 crossing). Re-exports read-fonts as `skrifa::raw`.
skrifa = "0.31"

# The Unicode general categories the ORACLE asks a regex for (`\p{L}` / `\p{N}` / `\p{M}`) — the classes
# `layout::hyphen_breaks_after` and `font::zero_width` have to agree with it about. regex-syntax bakes in a
# UCD snapshot of its own, so its answers are CHECKED against the driver's own engine (native_layout_text_spec)
# rather than assumed. `unicode-gencat` is the narrowest feature that answers them — it brings all 38 general
# categories plus the property name/value tables, ~480 KB of the .so — and it is also the ONLY one enabled, so
# a pattern outside `\p{<general category>}` does not parse: `\p{Alphabetic}`, `\p{Script=Hebrew}` and `\w`
# would all reach `unicode.rs`'s panic. Porting something that needs one (the oracle's `dir=auto` uses Script)
# means enabling its feature here first.
regex-syntax = { version = "0.8", default-features = false, features = ["unicode-gencat"] }
