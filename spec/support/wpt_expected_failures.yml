custom-elements/connected-callbacks-html-fragment-parsing.html:
- Inserting a custom element into a cloned document using HTML fragment parsing must
  enqueue a custom element upgrade reaction, not synchronously invoke its constructor
- Inserting a custom element into a document created by createHTMLDocument using HTML
  fragment parsing must enqueue a custom element upgrade reaction, not synchronously
  invoke its constructor
- Inserting a custom element into a new document using HTML fragment parsing must
  enqueue a custom element upgrade reaction, not synchronously invoke its constructor
- Inserting a custom element into an HTML document created by createDocument using
  HTML fragment parsing must enqueue a custom element upgrade reaction, not synchronously
  invoke its constructor
- Inserting a custom element into an HTML document fetched by XHR using HTML fragment
  parsing must enqueue a custom element upgrade reaction, not synchronously invoke
  its constructor
- Inserting a custom element into the document of an iframe using HTML fragment parsing
  must enqueue a custom element upgrade reaction, not synchronously invoke its constructor
- Inserting a custom element into the document of the template elements using HTML
  fragment parsing must enqueue a custom element upgrade reaction, not synchronously
  invoke its constructor
- Inserting a custom element into the document using HTML fragment parsing must enqueue
  a custom element upgrade reaction, not synchronously invoke its constructor
custom-elements/connected-callbacks.html:
- Inserting a custom element into a shadow tree in the document of an iframe must
  enqueue and invoke connectedCallback
- Inserting a custom element into the document of an iframe must enqueue and invoke
  connectedCallback
- Inserting an ancestor of custom element into the document of an iframe must enqueue
  and invoke connectedCallback
- Inserting the shadow host of a custom element into the document of an iframe must
  enqueue and invoke connectedCallback
custom-elements/cross-realm-callback-report-exception.html:
- adoptedCallback
- attributeChangedCallback
- connectedCallback
- constructor
- disconnectedCallback
custom-elements/custom-element-reaction-queue.html:
- Mutating a undefined custom element while upgrading a custom element must not enqueue
  or invoke reactions on the mutated element
- Mutating another custom element inside adopted callback must invoke all pending
  callbacks on the mutated element
- Upgrading a custom element must invoke attributeChangedCallback and connectedCallback
  before start upgrading another element
- Upgrading a custom element must not invoke attributeChangedCallback for the attribute
  that is changed during upgrading
- Upgrading a custom element must not invoke disconnectedCallback if the element is
  disconnected during upgrading
- Upgrading a disconnected custom element must not invoke connectedCallback if the
  element is connected during upgrading
custom-elements/customized-built-in-constructor-exceptions.html:
- Appending children in customized built-in constructor should work
- Make sure customized <input> element that sets attributes doesnt crash
custom-elements/disconnected-callbacks.html:
- Removing a custom element from a shadow tree in the document of an iframe must enqueue
  and invoke disconnectedCallback
- Removing a custom element from the document of an iframe must enqueue and invoke
  disconnectedCallback
- Removing an ancestor of custom element from the document of an iframe must enqueue
  and invoke disconnectedCallback
- Removing the shadow host of a custom element from athe document of an iframe must
  enqueue and invoke disconnectedCallback
custom-elements/element-internals-aria-element-reflection.html:
- Getting previously-unset ARIA element reflection properties on ElementInternals
  should return null.
- Setting aria-labelledby or ariaLabelledByElements on the custom element should supersede
  the value of ariaLabelledByElements on ElementInternals
- Setting ariaLabelledByElements on ElementInternals should change the accessible
  name of the custom element
custom-elements/element-internals-shadowroot.html:
- ElementInternals *can* be called after constructor, upgrade case
- ElementInternals cannot be called before constructor, upgrade case
- ElementInternals.shadowRoot doesn't reveal pre-attached closed shadowRoot
custom-elements/enqueue-custom-element-callback-reactions-inside-another-callback.html:
- Adopting an element with adoptingCallback while it has a connectedCallback in its
  custom element reaction queue must result in connectedCallback getting invoked before
  the adoption completes
- Adopting an element without adoptingCallback while it has a connectedCallback in
  its custom element reaction queue must not result in connectedCallback getting invoked
  before the adoption completes
- Connecting a element with connectedCallback while it has a disconnectedCallback
  in its custom element reaction queue must result in disconnectedCallback getting
  invoked before the insertion completes
- Connecting an element without connectedCallback while it has a disconnectedCallback
  in its custom element reaction queue must not result in disconnectedCallback getting
  invoked before the insertion completes
- Disconnecting an element with disconnectedCallback while it has a connectedCallback
  in its custom element reaction queue must result in connectedCallback getting invoked
  before the removal completes
- Disconnecting an element without disconnectedCallback while it has a connectedCallback
  in its custom element reaction queue must not result in connectedCallback getting
  invoked before the removal completes
- Setting an observed attribute on an element with attributeChangedCallback while
  it has a connectedCallback in its custom element reaction queue must not result
  in connectedCallback getting invoked before the attribute change completes
- Setting an observed attribute on an element with attributeChangedCallback while
  it has a connectedCallback in its custom element reaction queue must result in connectedCallback
  getting invoked before the attribute change completes
custom-elements/form-associated/ElementInternals-NotSupportedError.html:
- Form-related operations and attributes should throw NotSupportedErrors for non-form-associated
  custom elements.
custom-elements/form-associated/ElementInternals-form.html:
- ElementInternals.form should throws NotSupportedError if the target element is not
  a form-associated custom element
custom-elements/form-associated/ElementInternals-labels.html:
- ElementInternals.labels should throw NotSupportedError if the target element is
  not a form-associated custom element
- LABEL association
- LABEL click
custom-elements/form-associated/ElementInternals-setFormValue.html:
- ElementInternals.setFormValue() should throw NotSupportedError if the target element
