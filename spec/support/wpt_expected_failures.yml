# WPT IN-SCOPE backlog — subtests that currently fail but are real driver gaps
# we intend to fix (the conformance roadmap). Earned out-of-scope failures live
# in wpt_out_of_scope.yml. The gate (spec/wpt_spec.rb) loads BOTH and checks the
# union symmetrically: a non-PASS subtest in NEITHER file -> RED; a listed subtest
# that now PASSes -> RED. New failures default here (in-scope) until shown to be
# an earned non-goal, then moved to wpt_out_of_scope.yml with a reason.
#
# Each entry is one file: a list of not-yet-passing subtest names, or the string
# HARNESS_ERROR if the harness never completed. Shrinking THIS file is the roadmap.
#
# Regenerate after a driver fix:  bundle exec ruby script/regen_wpt_expected_failures.rb
#
---
FileAPI/BlobURL/cross-partition-navigation.https.html:
- Blob URL SVG <a> element click should enforce noopener for a cross-top-level-site
  navigation
- Blob URL area element click should enforce noopener for a cross-top-level-site navigation
- Blob URL link click should enforce noopener for a cross-top-level-site navigation
- Blob URL should partition subframe navigation.
- Blob URL window.open should enforce noopener for a cross-top-level-site navigation
FileAPI/BlobURL/cross-partition-self-fetch.https.html:
- Blob URL created in a cross-partition context can fetch itself in a same-partition
  context.
FileAPI/BlobURL/cross-partition-worker-creation.https.html:
- Cross-partition Dedicated worker shouldn't be created from blob URL.
- Cross-partition Shared worker shouldn't be created from blob URL.
FileAPI/BlobURL/cross-partition.https.html:
- Blob URL shouldn't be fetched from a cross-partition dedicated worker
- Blob URL shouldn't be fetched from a cross-partition iframe
- Blob URL shouldn't be fetched from a cross-partition service worker
- Blob URL shouldn't be fetched from a cross-partition shared worker
- Blob URL shouldn't be revocable from a cross-partition dedicated worker
- Blob URL shouldn't be revocable from a cross-partition iframe
- Blob URL shouldn't be revocable from a cross-partition shared worker
- Blob URL shouldn't be revocable from a service worker
html/webappapis/timers/settimeout-detached-iframe.html:
- setTimeout() on a detached iframe's window does not throw and its callback never
  runs
