# WPT IN-SCOPE backlog — subtests that currently fail but are real driver gaps
# we intend to fix (the conformance roadmap). Earned out-of-scope failures live
# in wpt_out_of_scope.yml. The gate (spec/wpt_spec.rb) loads BOTH and checks the
# union symmetrically: a non-PASS subtest in NEITHER file -> RED; a listed subtest
# that now PASSes -> RED. New failures default here (in-scope) until shown to be
# an earned non-goal, then moved to wpt_out_of_scope.yml with a reason.
#
# Each entry is one file: a list of not-yet-passing subtest names, or the string
# HARNESS_ERROR if the harness never completed. Shrinking THIS file is the roadmap.
#
# Regenerate after a driver fix:  bundle exec ruby script/regen_wpt_expected_failures.rb
#
---
FileAPI/BlobURL/opaque-origin.html:
- Blob URL created from data URL dedicated worker should have 'null' origin
- Blob URL created from data URL shared worker should have 'null' origin
FileAPI/FileReader/workers.html:
- FileReader created after a worker self.close()
FileAPI/blob/Blob-constructor-dom.window.js:
- Passing an platform object that supports indexed properties as the blobParts array
  should work (select).
FileAPI/url/cross-global-revoke.sub.html:
- It is not possible to revoke cross-origin blob URLs.
- It is possible to revoke same-origin blob URLs from a different worker global.
- It is possible to revoke same-origin blob URLs from different frames.
FileAPI/url/url-charset.window.js:
- Blob charset should override <meta charset>.
- Blob charset should override any auto-detected charset.
FileAPI/url/url-in-tags-revoke.window.js:
- Fetching a blob URL immediately before revoking it works in <script> tags.
- Fetching a blob URL immediately before revoking it works in an iframe navigation.
- Fetching a blob URL immediately before revoking it works in an iframe.
- Opening a blob URL in a new window by clicking an <a> tag works immediately before
  revoking the URL.
- Opening a blob URL in a new window immediately before revoking it works.
- Opening a blob URL in a noopener about:blank window immediately before revoking
  it works.
FileAPI/url/url-in-tags.window.js:
- Blob URL fragment is implemented.
- Blob URLs can be used in <script> tags
- Blob URLs can be used in iframes, and are treated same origin
FileAPI/url/url-lifetime.html:
- Removing an iframe revokes its URLs
- Terminating worker revokes its URLs
FileAPI/url/url-reload.window.js:
- Reloading a blob URL succeeds even if the URL was revoked.
- Reloading a blob URL succeeds.
