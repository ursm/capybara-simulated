# WPT IN-SCOPE backlog — subtests that currently fail but are real driver gaps
# we intend to fix (the conformance roadmap). Earned out-of-scope failures live
# in wpt_out_of_scope.yml. The gate (spec/wpt_spec.rb) loads BOTH and checks the
# union symmetrically: a non-PASS subtest in NEITHER file -> RED; a listed subtest
# that now PASSes -> RED. New failures default here (in-scope) until shown to be
# an earned non-goal, then moved to wpt_out_of_scope.yml with a reason.
#
# Each entry is one file: a list of not-yet-passing subtest names, or the string
# HARNESS_ERROR if the harness never completed. Shrinking THIS file is the roadmap.
#
# Regenerate after a driver fix:  bundle exec ruby script/regen_wpt_expected_failures.rb
#
---
dom/events/Event-dispatch-redispatch.html:
- Redispatching mouseup event whose default action dispatches a click event
dom/nodes/remove-and-adopt-thcrash.html:
- Check that removing a node and then adopting its parent into a different window/document
  doesn't crash.
html/semantics/forms/form-submission-0/form-submit-iframe-then-location-navigate.html:
- Verifies that location navigations take precedence when following form submissions.
html/semantics/forms/form-submission-0/jsurl-form-submit.tentative.html:
- 'Verifies that form submissions scheduled inside javascript: urls take precedence
  over the javascript: url''s return value.'
html/semantics/forms/form-submission-0/submit-file.sub.html:
- Posting a File
html/semantics/forms/the-label-element/proxy-modifier-click-to-associated-element.tentative.html:
- label with for attribute should proxy click events to the associated element on
  click
html/semantics/forms/the-select-element/customizable-select/select-input-parsing.tentative.html:
- Input tags should parse inside select if nested in another tag
- Input tags should parse inside select if there are no options first.
html/semantics/forms/the-select-element/customizable-select/selectedcontent-mutations.html:
- 'MutationObserver records during parsing of <select> with <selectedcontent>: test6'
- 'MutationObserver records during parsing of <select> with <selectedcontent>: test8'
html/semantics/forms/the-select-element/customizable-select/selectedcontentelement-attr.tentative.html:
- The selectedcontentelement attribute should set up an association between a select
  and a selectedcontent.
shadow-dom/focus/click-focus-delegatesFocus-click.html:
- click on the host with delegatesFocus with another host with delegatesFocus and
  a focusable child
- click on the host with delegatesFocus with another host with no delegatesFocus and
  a focusable child
- click on the host with no delegatesFocus with another host with delegatesFocus and
  a focusable child
- click on the host with no delegatesFocus with another host with no delegatesFocus
  and a focusable child
