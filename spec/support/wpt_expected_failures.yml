# WPT IN-SCOPE backlog — subtests that currently fail but are real driver gaps
# we intend to fix (the conformance roadmap). Earned out-of-scope failures live
# in wpt_out_of_scope.yml. The gate (spec/wpt_spec.rb) loads BOTH and checks the
# union symmetrically: a non-PASS subtest in NEITHER file -> RED; a listed subtest
# that now PASSes -> RED. New failures default here (in-scope) until shown to be
# an earned non-goal, then moved to wpt_out_of_scope.yml with a reason.
#
# WPT `.tentative` tests (unratified specs) are the exception: they default to
# wpt_out_of_scope.yml, since a spec still in flux only bakes in churn if chased.
# Nothing is lost — when it ratifies, WPT drops the `.tentative` suffix and the
# test re-enters HERE as a fresh failure automatically, so we handle it then.
# (Exception: a `.tentative` behavior real browsers already ship AND an app
# depends on is in-scope per the real-browser bar — keep it here.)
#
# Each entry is one file: a list of not-yet-passing subtest names, or the string
# HARNESS_ERROR if the harness never completed. Shrinking THIS file is the roadmap.
#
# Regenerate after a driver fix:  bundle exec ruby script/regen_wpt_expected_failures.rb
#
---
dom/nodes/remove-and-adopt-thcrash.html:
- Check that removing a node and then adopting its parent into a different window/document
  doesn't crash.
shadow-dom/focus/click-focus-delegatesFocus-click.html:
- click on the host with no delegatesFocus with another host with delegatesFocus and
  a focusable child
- click on the host with no delegatesFocus with another host with no delegatesFocus
  and a focusable child
