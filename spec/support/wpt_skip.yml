# WPT files excluded from the conformance run because they CRASH or
# pathologically hang the driver — as opposed to merely producing wrong
# subtest results (those keep running and are listed in wpt_expected_failures.yml
# if in-scope, or wpt_out_of_scope.yml with a reason if an earned non-goal).
#
# This is the driver-crasher backlog. Each entry is relpath => reason. Removing
# an entry means the underlying driver crash/hang has been fixed; the file then
# rejoins the run and needs its real result reflected in the allowlist.
#
# Keep this list as short as possible: a crasher hides every subtest in the
# file. Prefer fixing the driver over adding here.
#
# A second, narrow category also lives here: large DATA-DRIVEN conformance
# tables where a small residual fails. IDNA is now IMPLEMENTED (URL host parsing
# punycodes correctly via the uri-idna gem on the Ruby host — see Browser#
# domain_to_ascii; the non-IDNA url-constructor / a-element IDNA cases now PASS).
# These two files still carry a residual (~74 / ~45) where uri-idna's UTS46
# conformance level / Unicode version differs from the WPT reference data
# (bidi/contextj, variation selectors, lenient trailing-`=` punycode, …). Kept
# skipped — not per-case allowlisted — because the failing set is large + tied to
# the gem's Unicode version, same convention as the legacy-encoding tables below.
"url/IdnaTestV2.any.js": >-
  IDNA/Unicode-host conformance (~2300 data-driven cases). IDNA IS implemented
  (uri-idna); ~95% pass. The residual ~74 are uri-idna's UTS46/Unicode-version
  gap vs the WPT reference data — kept skipped per the data-driven convention.
"url/toascii.window.js": >-
  Host `domainToASCII`/IDNA conversion (~600 cases). IDNA IS implemented
  (uri-idna); most pass. The residual ~45 are uri-idna's conformance gap vs the
  WPT reference (lenient trailing-`=` punycode, bidi edge cases) — see IdnaTestV2.

# Legacy MULTIBYTE CJK encodings (Shift_JIS / EUC-JP / ISO-2022-JP /
# EUC-KR / GBK / gb18030 / Big5). What js/src/encoding.js DOES model: UTF-8,
# UTF-16LE/BE, x-user-defined, and every WHATWG SINGLE-byte index table
# (windows-125x, ISO-8859-*, KOI8-*, macintosh, x-mac-cyrillic, IBM866,
# windows-874). What it does NOT: the multibyte CJK decoder state machines.
#
# Why not delegate to Ruby's `Encoding` (the way URL host parsing delegates IDNA
# to the uri-idna gem)? Investigated 2026-06-22 — Ruby's `Encoding` /
# `Encoding::Converter` is NOT a viable WHATWG conformance backend, for two
# evidenced reasons that no encode/decode option closes:
#   1. Error-byte accounting differs. WHATWG re-emits orphaned bytes during error
#      recovery (`[1b 24]` -> "�$" — the stray `$` becomes a literal); Ruby's
#      converter drops them, even driven via `primitive_convert` + putback. 21 of
#      the 34 iso-2022-jp-decoder subtests probe exactly this recovery.
#   2. Raw mappings diverge even on VALID input. WHATWG's ISO-2022-JP Roman state
#      maps 0x5C->¥ (U+00A5) / 0x7E->‾ (U+203E) per JIS X 0201; Ruby maps them to
#      ASCII \ / ~. Ruby's CJK tables are JIS/iconv-lineage, not WHATWG-index-
#      lineage, so they differ on a scatter of code points regardless of options.
# Reproducing these byte-for-byte needs the actual WHATWG decoder state machines +
# index tables compiled into JS — the ~600KB-per-realm V8 snapshot cost we
# deliberately defer (NOT a cheap Ruby-host shortcut like IDNA). These are also
# exhaustive data-driven tables (every code point / byte pair), so once they run
# they dump 200k+ per-subtest failures into the allowlist. Skip the whole subtree
# (directory-prefix keys with a trailing `/`) to keep the backlog focused.
"encoding/legacy-mb-japanese/": >-
  Legacy Japanese multibyte (Shift_JIS/EUC-JP/ISO-2022-JP). Out of scope — needs
  the WHATWG multibyte decoder state machines + index tables in JS; Ruby Encoding
  is not WHATWG-conformant (see header). Exhaustive per-code-point tables.
"encoding/legacy-mb-korean/": >-
  Legacy Korean multibyte (EUC-KR/windows-949). Out of scope — see above.
"encoding/legacy-mb-schinese/": >-
  Legacy Simplified Chinese (GBK/gb18030). Out of scope — see above.
"encoding/legacy-mb-tchinese/": >-
  Legacy Traditional Chinese (Big5). Out of scope — see above.
"encoding/single-byte-decoder.window.js": >-
  Single-byte decoders ARE modeled (the TextDecoder variant passes). The remaining
  variants need byte-level XHR responseText + iframe
  document.characterSet/inputEncoding decoding (single-byte-raw.py /
  text-plain-charset.py CGI) — an unmodeled byte-transport layer, deferred to a
  comprehensive document-charset effort. ~336 transport-dependent cases, NOT the
  decoder tables (those work).
"encoding/iso-2022-jp-decoder.any.js": >-
  ISO-2022-JP stateful decoder. Out of scope — needs the WHATWG decoder state
  machine; 21/34 subtests probe error-recovery byte accounting Ruby Encoding can't
  reproduce, and Ruby's Roman-state mapping diverges (see header).
"encoding/iso-2022-jp-encoder.html": >-
  ISO-2022-JP encoder (form/href submission in a legacy-charset document). Out of
  scope — needs the WHATWG encoder + the document-charset path, see header.
"encoding/big5-encoder.html": >-
  Big5 encoder (form/href submission in a legacy-charset document). Out of scope —
  see iso-2022-jp-encoder above.

"encoding/unsupported-encodings.any.js": >-
  Flaky AND out of scope. It decodes UTF-7 (not a WHATWG encoding) and UTF-32
  (not a WHATWG decode target) via the async XHR `overrideMimeType` charset path
  (decode_test → XMLHttpRequest), which races the virtual-clock drain: ~4/5 runs
  the harness never completes (HE), ~1/5 it completes — so it intermittently
  flips the symmetric gate red. The TextDecoder-constructor side of unsupported
  labels is already covered green by api-invalid-label.any.js.

"url/failure.html": >-
  The XHR / sendBeacon / Location / window.open sinks throw synchronously on a
  malformed URL (most subtests pass). IDNA is now implemented (uri-idna), so many
  of the former Unicode-host cases now reject correctly; a residual data-driven
  set remains where uri-idna is more lenient than the WPT reference (accepts hosts
  the test expects to fail). Large + Unicode-version-tied, so kept skipped per the
  same data-driven convention as IdnaTestV2 / toascii; the non-IDNA URL-parse-
  failure behaviour is fully covered (green) by url-constructor.any.js.

"dom/events/scrolling/input-text-scroll-event-when-using-arrow-keys.html": >-
  Scroll-on-arrow-key test: its <body onload=runTest()> now runs (window-forwarded
  handler activation), but runTest awaits a test_driver arrow-key scroll that the
  driver can't satisfy (no scroll geometry / key-driven scrolling), and the wait
  never resolves — testharness's own timeout can't fire either, so the harness
  hangs instead of completing. Out-of-scope layout/input subsystem (CLAUDE.md
  rule 1); excluded so it doesn't burn force-timeout cycles every run. Sibling
  scrollend/wheel tests that DO complete are listed in wpt_out_of_scope.yml.

# Tentative WICG `Element.createValueRange()` — an opaque Range over a form
# control's value text (input/textarea). The whole `dom/ranges/tentative/` tree
# is 18 createValueRange files (~140 subtests). Out of scope (rule 1): an
# unshipped feature whose core is getBoundingClientRect/getClientRects geometry
# over the control's INTERNAL text layout + CSS Custom Highlight API integration
# — a layout / text-geometry / rendering engine we deliberately don't model; no
# library or app uses it. The geometry / display-none files additionally have
# layout-dependent, NON-DETERMINISTIC failing sets that can't be name-allowlisted
# (they re-leak past wpt_expected_failures every regen), so skip the whole
# subtree in one entry — same treatment as the encoding / IDNA structural
# non-goals above. (Exposed once parse5 stopped silently dropping the trailing
# `<script>` these files load; before that they registered zero subtests.)
"dom/ranges/tentative/": >-
  Tentative WICG Element.createValueRange() (opaque Range over form-control value
  text). Out of scope — getBoundingClientRect/getClientRects geometry over the
  control's internal text layout + CSS Custom Highlight API, i.e. a layout /
  rendering engine we don't model (rule 1); unshipped, no library/app uses it.
  Several files have non-deterministic layout-dependent failing sets that can't be
  name-allowlisted, so the whole 18-file subtree is skipped.

# Tentative pattern-attribute test that deliberately feeds a catastrophic-
# backtracking regex (`(a+)+$` over a long non-matching string) to the JS regex
# engine. V8's regex matcher runs it synchronously to completion in ~56 s — finite
# but pathologically slow, and the virtual-clock force-timeout can't interrupt a
# native regex call (only CSIM_V8_CALL_TIMEOUT_MS catches it, which the gate
# doesn't set). Skipped so it doesn't add ~a minute to every gate run. Tentative,
# probes a perf-DoS guard real browsers implement in their regex engine — not a
# driver-behaviour gap we can close without bounding V8's matcher.
"html/semantics/forms/constraints/infinite_backtracking.tentative.html": >-
  Catastrophic-backtracking pattern regex; V8 runs it synchronously for ~56 s
  (finite but pathological), uninterruptible by the virtual-clock force-timeout.
  Skipped to keep the gate fast — see header.
"service-workers/service-worker/unregister-immediately-before-installed.https.html": >-
  Registers a worker script that is a DELIBERATE synchronous infinite loop
  (resources/onparse-infiniteloop-worker.js) and expects Clear-Site-Data to abort it.
  run_worker evaluates the worker script with an in-thread V8 eval that holds the GVL,
  so the spinning script freezes the whole process — uninterruptible by timeout/kill
  (same class as infinite_backtracking). Needs engine-level eval preemption
  (Isolate::TerminateExecution surfaced through rusty_racer) plus Clear-Site-Data
  semantics before it can run.
"service-workers/cache-storage/cache-abort.https.any.js": >-
  Aborts an in-flight cache.add/addAll/put whose request targets
  fetch/api/resources/infinite-slow-response.py — a handler that streams an unbounded
  body. Our fetch reads the response body synchronously on the calling thread (GVL held),
  so it spins before the abort can fire — the whole file hangs uninterruptibly (same class
  as infinite_backtracking). Needs an abortable streaming-fetch runtime.

