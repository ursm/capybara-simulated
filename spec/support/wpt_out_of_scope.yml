# WPT OUT-OF-SCOPE failures — subtests that fail because they need a subsystem we
# deliberately do NOT model (per CLAUDE.md rule 1): a layout/rendering engine, a
# real async runtime / streams, IDNA / legacy-multibyte encoding tables, or a spec
# edge no real library/app depends on. These are NOT a backlog; each carries the
# reason it is earned out-of-scope. The in-scope roadmap is wpt_expected_failures.yml.
#
# The gate (spec/wpt_spec.rb) merges this with the in-scope file and checks the union
# symmetrically, so an out-of-scope subtest that starts PASSing still turns RED (move
# it to the in-scope file / delete it). Format per file: a list of {name, reason}.
#
# regen_wpt_expected_failures.rb PRESERVES these classifications + reasons across
# runs; to reclassify, move a line between this file and wpt_expected_failures.yml.
#
---
dom/collections/HTMLCollection-supported-property-indices.html:
- name: Handling of property names that look like integers around 2^32
  reason: Exactly the 2^32 index-boundary exotic-object edge cited in rule 2; no real
    library/app depends on it and matching requires special index-coercion handling.
dom/events/Event-dispatch-on-disabled-elements.html:
- name: CSS Animation animationstart, animationiteration, animationend fire on disabled
    form elements
  reason: Requires CSS animations actually firing animationstart/iteration/end events,
    which needs a layout/rendering engine we deliberately do not model.
- name: CSS Animation's animationcancel event fires on disabled form elements
  reason: Requires CSS animation lifecycle + animationcancel events from style/display
    changes, which needs the rendering engine we do not model.
- name: CSS Transitions transitioncancel event fires on disabled form elements
  reason: Requires CSS transition firing transitioncancel on style-flush, which needs
    layout/style-animation engine we do not model.
- name: CSS Transitions transitionrun, transitionstart, transitionend events fire
    on disabled form elements
  reason: Requires CSS transition events fired on getComputedStyle flush, which needs
    the layout/transition engine we do not model.
- name: Real clicks on disabled elements must not dispatch events.
  reason: Uses test_driver.click for a real hit-tested click on a rendered element;
    depends on visual hit-testing we do not model.
dom/events/Event-dispatch-redispatch.html:
- name: Redispatching mouseup event whose default action dispatches a click event
  reason: Driven by test_driver.click synthesizing a real trusted mouse click with
    default activation; depends on visual hit-testing we do not model.
dom/events/EventListener-invoke-legacy.html:
- name: Legacy listener of animationend
  reason: Requires real CSS animation/transition timeline to fire animationend; we
    don't model animations firing.
- name: Legacy listener of animationstart
  reason: Requires real CSS animation timeline to fire animationstart; animations
    are not modeled.
- name: Legacy listener of transitionend
  reason: Requires real CSS transition timeline to fire transitionend; transitions
    are not modeled.
- name: Listener of animationend
  reason: Depends on style/animation engine actually running the @keyframes animation
    to dispatch animationend.
- name: Listener of animationstart
  reason: Depends on style/animation engine actually running the animation to dispatch
    animationstart.
- name: Listener of transitionend
  reason: Depends on layout/style transition engine to fire transitionend after computed-style
    change.
dom/events/click-on-absolute-pseudo.html:
- name: Click on pseudo-element that disappears on mousedown
  reason: Needs pseudo-element hit-testing, event.pseudoTarget and target.pseudo('::after')
    from rendered geometry; layout not modeled.
dom/events/mouse-event-retarget.html:
- name: offsetX is correctly adjusted
  reason: Asserts ev.offsetX==42 derived from clientX minus target box position; requires
    layout geometry (offsetX truthiness) not modeled.
dom/events/no-focus-events-at-clicking-editable-content-in-link.html:
- name: Click editable element in link
  reason: Drives input via test_driver.Actions().pointerMove(x,y).pointerDown/Up at
    pixel coords; needs visual hit-testing/synthetic-input subsystem we don't model.
- name: Click editable link
  reason: Drives input via test_driver.Actions() pointerMove/Down/Up at pixel coords
    with origin element; needs hit-testing/synthetic-input subsystem we don't model.
dom/events/pointer-event-document-move.html:
- name: Moving a node to new document should move the registered event listeners together
  reason: Assertion (listeners survive adopt) is DOM-core but only reachable via test_driver.click
    pixel input injection, which needs hit-testing we don't model.
dom/events/scrolling/iframe-chains.html:
- name: Wheel scroll in iframe chains to containing element.
  reason: Wheel scroll chaining across nested iframes needs scroll geometry, wheel
    events, and viewport layout we deliberately don't model.
dom/events/scrolling/save-iframe-scroll-offset-when-display-none.html:
- name: Ensure that the scroll position is not lost when the local iframe is set to
    display:none and shown again.
  reason: Requires preserving rendered scroll offset across display:none toggle; depends
    on scroll geometry/layout engine we don't model.
- name: Ensure that the scroll position is not lost when the remote iframe is set
    to display:none and shown again.
  reason: Cross-origin iframe scroll-offset persistence across display:none; needs
    scroll geometry + remote frame layout we don't model.
dom/events/scrolling/scroll-cross-origin-iframes.html:
- name: Verify sibling cross-origin iframes can wheel-scroll.
  reason: Wheel-scrolling cross-origin iframes needs wheel event + scroll geometry
    + viewport layout subsystem we don't model.
dom/events/scrolling/scroll-event-fired-to-element.html:
- name: scrollTop and scrollLeft when scrolling above maximum offset.
  reason: Clamping scrollTop/scrollLeft to scrollable max requires layout-computed
    content/overflow dimensions we don't model.
dom/events/scrolling/scroll-event-fired-to-iframe.html:
- name: scrollX and scrollY when scrolling above maximum Scroll.
  reason: Clamping iframe scrollX/scrollY to max requires viewport + content layout
    dimensions and scroll geometry we don't model.
dom/events/scrolling/scrollend-event-fired-after-instant-scroll-in-microtask.html:
- name: scrolling state is false at the end of the test
  reason: Needs scroll geometry + scrollend event firing after instant scroll; scroll/scrollend
    is a layout subsystem we deliberately don't model.
dom/events/scrolling/scrollend-event-fired-for-mandatory-snap-point-after-load.html:
- name: scrollend event fired after load for mandatory snap point
  reason: Requires CSS scroll-snap layout to compute snap point and fire scrollend;
    scroll-snap geometry is an unmodeled layout subsystem.
dom/events/scrolling/scrollend-event-fires-for-repeat-key-ending-after-scroll-container-end-is-reached.html:
- name: scrollend event is fired after repeated Page Down key presses reach the end
    of the scroll region.
  reason: Needs scroll-region geometry to detect container end and fire scrollend
    on key scroll; scroll geometry/events unmodeled.
dom/events/scrolling/scrollend-fires-to-text-input.html:
- name: scrolled input field should receive scrollend when setting scrollLeft.
  reason: Requires real scroll geometry on input + scrollend event; scroll/scrollend
    is a deliberately unmodeled layout subsystem.
- name: 'scrolled input field should receive scrollend with scrollBy({ behavior: ''instant''
    }).'
  reason: Requires scroll geometry + scrollend after scrollBy; scroll/scrollend layout
    subsystem unmodeled.
- name: 'scrolled input field should receive scrollend with scrollBy({ behavior: ''smooth''
    }).'
  reason: Requires smooth-scroll animation geometry + scrollend after scrollBy; scroll/scrollend
    layout subsystem unmodeled.
- name: 'scrolled input field should receive scrollend with scrollTo({ behavior: ''instant''
    }).'
  reason: Requires scroll geometry + scrollend after scrollTo; scroll/scrollend layout
    subsystem unmodeled.
- name: 'scrolled input field should receive scrollend with scrollTo({ behavior: ''smooth''
    }).'
  reason: Requires smooth-scroll animation geometry + scrollend after scrollTo; scroll/scrollend
    layout subsystem unmodeled.
dom/events/scrolling/scrollend-with-snap-on-fractional-offset.html:
- name: snap to fractional offset fires scrollend exactly once.
  reason: Requires CSS scroll-snap layout at fractional offsets to fire scrollend
    once; scroll-snap geometry unmodeled.
dom/events/webkit-animation-end-event.html:
- name: event types for prefixed and unprefixed animationend event handlers should
