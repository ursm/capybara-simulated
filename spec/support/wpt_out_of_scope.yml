  reason: Requires CSS transition engine on pseudo-elements with mid-transition transform
    value; no transition/layout engine modeled.
dom/nodes/moveBefore/continue-css-transition-transform.html:
- name: Node.moveBefore should preserve CSS transition state (transform)
  reason: Requires CSS transition engine firing with mid-transition transform computed
    value; no transition/layout engine modeled.
dom/nodes/moveBefore/css-animation-commit-styles.html:
- name: Calling commitStyles after Node.moveBefore should commit mid-transition value
  reason: Requires animationstart + getAnimations()[0].commitStyles() writing mid-animation
    transform; no animation/layout engine modeled.
dom/nodes/moveBefore/css-transition-cross-document.html:
- name: Moving a transition across documents should reset its state
  reason: Awaits transitionstart (CSS transition firing) and asserts animated getBoundingClientRect.x;
    needs animation+layout engine we don't model.
dom/nodes/moveBefore/css-transition-cross-shadow.html:
- name: Moving an element with a transition across shadow boundaries preserves the
    transition
  reason: Awaits transitionstart and asserts animated getBoundingClientRect.x < 400;
    CSS transition firing + layout geometry not modeled.
dom/nodes/moveBefore/css-transition-to-disconnected-document.html:
- name: Moving an element with a transition to a disconnected document should reset
    the transitionm state
  reason: Awaits transitionstart and asserts getBoundingClientRect.x range after rAF;
    CSS transition firing + layout geometry not modeled.
dom/nodes/moveBefore/css-transition-trigger.html:
- name: Node.moveBefore should trigger CSS transition state (left) if needed
  reason: Awaits transitionstart event and asserts mid-transition getBoundingClientRect.x==200;
    CSS transition firing + layout geometry not modeled.
dom/nodes/moveBefore/fire-focusin-focusout.html:
- name: Don't fire focusin and then correct when moving to a tree that is made inert
    using style
  reason: Inertness via display:none(:has) + async focusout fixup after rAF; depends
    on rendered-visibility-derived inertness not modeled.
dom/nodes/moveBefore/focus-preserve.html:
- name: when reparenting a focused element into a hidden parent, reset the document
    focus
  reason: hidden/display:none parent must async-blur focused element to document.body;
    rendered-visibility-driven focus reset not modeled.
- name: when reparenting an ancestor of an focused element into a hidden parent, reset
    the document focus
  reason: hidden parent async-blurs descendant-focused element; rendered-visibility-driven
    focus reset not modeled.
dom/nodes/moveBefore/focus-within.html:
- name: ":focus-within should be eventually up to date when moving to a subtree that
    would become inert via style"
  reason: display:none(:has) makes subtree inert and clears :focus-within after rAF;
    rendered-visibility-derived inertness/focus not modeled.
dom/nodes/moveBefore/fullscreen-preserve.html:
- name: Document#fullscreenElement
  reason: Needs requestFullscreen()/fullscreenElement fullscreen subsystem + trusted_click
    testdriver; fullscreen is a deliberately unmodeled rendering surface.
dom/nodes/moveBefore/moveBefore-from-light-to-shadow.html:
- name: moveBefore-from-light-to-shadow
  reason: Asserts getBoundingClientRect().width>0 then ==0 after slotting into display:none;
    layout geometry + render-visibility not modeled.
dom/nodes/moveBefore/moveBefore-shadow-inside.html:
- name: moveBefore-shadow-inside
  reason: Asserts shadow div getBoundingClientRect().width==300 after move+rAF; resolved
    box geometry requires a layout engine.
dom/nodes/moveBefore/moveBefore-size-query.html:
- name: moveBefore() between different size containers invalidates target
  reason: Relies on @container (width=400px) size container query resolving via inline-size
    layout; container queries need a layout engine.
dom/nodes/moveBefore/pointer-events.html:
- name: Pointer capture should not be released when moving
  reason: Needs real pointer-capture state via testdriver Actions pointerMove/pointerDown
    + hit-testing; hasPointerCapture is a stub, pointer subsystem unmodeled.
dom/nodes/moveBefore/relevant-mutations.html:
- name: Moving <img> into a <picture> triggers a relevant mutation on the <img>, loading
    <source>
  reason: Requires <picture>/<source> resource-selection + real image fetch firing
    <img> load events; no image-loading/network resource pipeline modeled.
- name: Moving <source> out of <picture> triggers a relevant mutation on sibling <img>
  reason: Requires srcset/media resource-selection on move re-firing <img> load; depends
    on image fetch subsystem we deliberately don't model.
dom/nodes/remove-and-adopt-thcrash.html:
- name: Check that removing a node and then adopting its parent into a different window/document
    doesn't crash.
  reason: window.open() aux windows are URL-only by design (no per-window VM/document);
    popup.document.body.appendChild(document.body) has no real second-window document.
domparsing/XMLSerializer-serializeToString.html:
- name: Check if a prefix bound to an empty namespace URI ("no namespace") serialize
  reason: 'Mutually contradictory with the ''redundant/inconsistent xmlns="..." is
    dropped'' subtests in this same file, which we PASS: this one wants a redundant
    xmlns="" KEPT, those want redundant xmlns DROPPED. No serializer passes all —
    verified against Chrome, which keeps xmlns="" here (passing this subtest) but
    then fails both drop subtests. We follow the aggressive-drop spec revision, which
    passes strictly more of the file.'
- name: Check if the prefix of an attribute is NOT preserved in a case where neither
    its prefix nor its namespace URI is not already used.
  reason: Encodes the abandoned DOM-Parsing issue-#29 revision that generated an ns1
    prefix; real browsers (verified against Chrome/Firefox) preserve the attribute's
    author prefix instead, so this subtest fails in real browsers too.
- name: Drop inconsistent xmlns="..." by matching on local name
  reason: Encodes an abandoned DOM-Parsing revision; real browsers (verified against
    Chrome) keep the literal xmlns attributes rather than dropping them by local-name
    match, so this subtest fails in real browsers too.
