dom/lists/DOMTokenList-iteration.html:
- name: classList inheritance from Array.prototype
  reason: Asserts DOMTokenList iterator/keys/values/forEach are the IDENTICAL Array.prototype
    functions; our DOMTokenList intentionally does not subclass Array (no lib needs
    object identity).
dom/nodes/Document-URL.html:
- name: Document.URL with redirect
  reason: Requires iframe to follow a real HTTP 302 redirect to redirect.py, fire
    onload, then read contentDocument.URL as the final URL; needs true network async
    navigation.
dom/nodes/Document-contentType/contentType/contenttype_bmp.html:
- name: BMP document.contentType === 'image/bmp'
  reason: Loading a binary image into an iframe makes the UA synthesize an image-viewer
    document; image-document synthesis is a rendering/UA concern no lib depends on.
dom/nodes/Document-contentType/contentType/contenttype_gif.html:
- name: GIF document.contentType === 'image/gif'
  reason: Binary image in an iframe yields a UA-synthesized image-viewer document;
    image-document rendering is a non-modeled UA concern no app relies on.
dom/nodes/Document-contentType/contentType/contenttype_jpg.html:
- name: JPG document.contentType === 'image/jpeg'
  reason: Binary image in an iframe yields a UA-synthesized image-viewer document;
    image-document rendering is a non-modeled UA concern no app relies on.
dom/nodes/insertion-removing-steps/Node-append-meta-referrer-and-script-from-fragment.html:
- name: "<meta name=referrer> gets processed and applied in the post-insertion steps"
  reason: Asserts referrer-policy effect observed via real async fetch() to an echo-referrer
    .py resource; needs true network async runtime not modeled.
dom/nodes/insertion-removing-steps/Node-appendChild-script-and-source-from-fragment.html:
- name: Empty <source> immediately sets media.networkState during DOM insertion, so
    that an earlier-running script can observe networkState
  reason: Needs HTMLMediaElement resource-selection / media-load algorithm setting
    networkState=NETWORK_NO_SOURCE; media subsystem not modeled, no lib depends.
dom/nodes/moveBefore/child-style-preserve.html:
- name: child-style-preserve
  reason: Asserts getBoundingClientRect().width equals 100 then 200 after style change;
    pure layout geometry, not modeled.
dom/nodes/moveBefore/continue-css-animation-left.html:
- name: Node.moveBefore should preserve CSS animation state (left)
  reason: Requires CSS animation engine firing animationstart + mid-animation getComputedStyle(left);
    no animation/layout engine modeled.
dom/nodes/moveBefore/continue-css-animation-transform.html:
- name: Node.moveBefore should preserve CSS animation state (transform)
  reason: Requires CSS animation engine firing animationstart + mid-animation transform
    value; no animation/layout engine modeled.
dom/nodes/moveBefore/continue-css-transition-left-pseudo.html:
- name: Node.moveBefore should preserve CSS transition state on pseudo-elements (left)
  reason: Requires CSS transition engine on pseudo-elements with mid-transition computed
