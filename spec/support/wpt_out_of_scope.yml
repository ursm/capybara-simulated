  reason: triggerAnimation + waitForEvent requires a real CSS animation to fire animationend;
    CSS animation engine deliberately unmodeled.
- name: event types for prefixed and unprefixed animationend event listeners should
    be named appropriately
  reason: Depends on a real CSS animation firing animationend; CSS animation engine
    deliberately unmodeled.
- name: onwebkitanimationend event handler should not trigger if an unprefixed event
    handler also exists
  reason: triggerAnimation must fire a real animationend to exercise dedup; CSS animation
    engine unmodeled.
- name: onwebkitanimationend event handler should not trigger if an unprefixed listener
    also exists
  reason: triggerAnimation must fire a real animationend to exercise dedup; CSS animation
    engine unmodeled.
- name: onwebkitanimationend event handler should trigger for an animation
  reason: Requires a real CSS animation to fire so the prefixed handler runs; CSS
    animation engine unmodeled.
- name: webkitAnimationEnd event listener is case sensitive
  reason: triggerAnimation must fire a real animationend; CSS animation engine unmodeled
