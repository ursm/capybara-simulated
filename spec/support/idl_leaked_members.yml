# Interface-specific IDL members still on the shared Element/Node.prototype (so
# `'member' in <span>` is wrongly true). Every other one is its interface's own, as the
# generated bindings install it (script/gen_bindings.mjs). This RESIDUAL is the floor:
#   - rel / relList — also reflected on the RENDERED SVG <a> (SVGAElement), which the
#     driver gives no interface prototype, so the one accessor stays on the base.
# Ratcheting + symmetric (spec/idl_coverage_spec.rb 'per-interface ownership'): a NEW
# leak, or a now-absent entry still listed, turns the suite red.
- rel
- relList
