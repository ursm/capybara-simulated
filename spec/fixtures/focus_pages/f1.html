<!doctype html><meta charset=utf-8><body><script>const fin=(s)=>{const o=document.createElement("pre");o.id="out";o.textContent=s+" done";document.body.append(o)};
const tag=(d)=>{const e=d.activeElement;return e?(e.id||e.tagName):"null"};
const probe=(b)=>{let n=0;b.addEventListener('focus',()=>n++);b.focus();return tag(b.ownerDocument)+'/'+n};
const r=document.createElement('iframe');document.body.append(r);
const rb=r.contentDocument.createElement('button');rb.id='rb';r.contentDocument.body.append(rb);
r.remove();
const f=document.createElement('iframe');f.srcdoc='<button id=fb>x</button>';
let old=null;
f.onload=()=>{
  if(!old){old=f.contentDocument.getElementById('fb');f.srcdoc='new';return}
  fin(probe(rb)+' '+probe(old));
};
document.body.append(f);</script>
