# Cargo workspace root for the native extension (ext/csim_native): the V8 engine
# (rusty_racer, linked as a library) + the native DOM. rb-sys's ExtensionTask runs
# `cargo metadata` from here; the crate itself lives under ext/.
[workspace]
members  = ["ext/csim_native"]
resolver = "2"

# The style engine is stylo from a fork (github.com/ursm/stylo, branch `csim`): the published crate plus the longhands
# and the grammar Servo builds leave to Gecko, enabled for Servo builds, and the UA-only pseudo-class its sheet keys a
# list-box `<select>` on (`:-servo-list-box`). Every crate of the stylo workspace comes from the fork, so
# stylo and the selector matcher share ONE selectors / cssparser, as they must.
# The HTML parser is html5ever from a fork (github.com/ursm/html5ever, branch `csim`): 0.40.1, its tree builder
# telling the sink of EVERY element it pops off the stack of open elements, as `TreeSink::pop` is documented to.
[patch.crates-io]
html5ever            = {git = "https://github.com/ursm/html5ever", branch = "csim"}
stylo                = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_derive         = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_traits         = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_atoms          = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_dom            = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_static_prefs   = {git = "https://github.com/ursm/stylo", branch = "csim"}
stylo_malloc_size_of = {git = "https://github.com/ursm/stylo", branch = "csim"}
selectors            = {git = "https://github.com/ursm/stylo", branch = "csim"}
servo_arc            = {git = "https://github.com/ursm/stylo", branch = "csim"}
to_shmem             = {git = "https://github.com/ursm/stylo", branch = "csim"}
to_shmem_derive      = {git = "https://github.com/ursm/stylo", branch = "csim"}
