name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary engine: V8 (rusty_racer), auto-selected when both engine gems are
  # present. Runs the full suite including the WPT conformance gate, across the
  # supported Ruby versions.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v7

      # `canvas_image_spec` decodes images through ruby-vips, which `dlopen`s
      # `libvips.so.42` at runtime; the `<video>` / createImageBitmap-from-video
      # path shells out to `ffprobe` + `ffmpeg` for first-frame decode (the WPT
      # imagebitmap video subtests need it, else their factory rejects). Install
      # both before the spec run.
      - run: sudo apt-get update && sudo apt-get install -y libvips42t64 ffmpeg

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Multi-process run (worker count = vCPUs). The WPT gate — the dominant
      # cost centre — is sharded across spec/wpt_gate/ files precisely so it
      # distributes here; a serial `bundle exec rspec` remains equivalent.
      # Groups are balanced by the committed runtime log (file-size grouping
      # packs the tiny-but-heavy wpt shard files into one group); refresh it
      # with `bundle exec rake parallel_runtime_log` when balance drifts.
      # Spec files missing from the log are weighted at the average (silent
      # imbalance), and past 50% missing parallel_tests aborts with
      # RuntimeLogTooSmallError — a big spec reorganization needs the refresh.
      # --serialize-stdout keeps each group's output contiguous so a red
      # group's failure block stays readable in the CI log.
      - run: bundle exec parallel_rspec spec --group-by runtime --runtime-log spec/support/parallel_runtime_rspec.log --serialize-stdout

  # Secondary engine: QuickJS. It shares the JS bridge but has a distinct runtime
  # layer (value marshalling, no per-frame realms), so it needs its own coverage
  # to catch engine-specific regressions. The WPT gate (`:wpt`) is excluded: its
  # expected-failures allowlist is tuned to V8 (the conformance engine), and
  # QuickJS legitimately diverges on a handful of legacy-encoding / cross-realm
  # subtests. One Ruby suffices — the QuickJS-specific risk is in the engine
  # layer, not the (V8-matrix-covered) Ruby driver code.
  test-quickjs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y libvips42t64 ffmpeg

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - run: bundle exec parallel_rspec spec --group-by runtime --runtime-log spec/support/parallel_runtime_rspec.log --serialize-stdout -o '--tag ~wpt'
        env:
          CSIM_JS_ENGINE: quickjs
