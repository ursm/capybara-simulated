name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary engine: V8 (rusty_racer), auto-selected when both engine gems are
  # present. Runs the full suite including the WPT conformance gate, across the
  # supported Ruby versions.
  test:
    runs-on: ubuntu-latest
    # Runs in 5-8 min; the cap is there for the runner-side hangs (an apt mirror
    # that never answers has stalled this step for 20+ min more than once), which
    # GitHub would otherwise let sit for its 6-hour default before anyone can
    # `gh run rerun --failed`.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v7

      # ruby-vips `dlopen`s `libvips.so.42` at load, and the gem requires it at load,
      # so WITHOUT this step nothing runs — not just the canvas specs. (It backs
      # image decoding, and an image's intrinsic size is what LAYOUT sizes an `<img>`
      # box from, which is why it stopped being optional.) The `<video>` /
      # createImageBitmap-from-video path shells out to `ffprobe` + `ffmpeg` for
      # first-frame decode (the WPT imagebitmap video subtests need it, else their
      # factory rejects). Install both before the spec run — and keep this step
      # failing loudly: made best-effort, every job would fail later and less clearly.
      - name: Install libvips + ffmpeg
        # `--no-install-recommends` because most of the 102 MB apt otherwise fetches
        # is ffmpeg's recommends — a pocketsphinx speech model, OpenAL, JACK, the
        # Intel VA drivers — and none of it is what the specs decode with: the video
        # fixtures are h264 and vp9, both out of libavcodec60, which ffmpeg DEPENDS
        # on. It halves this step on a good day.
        #
        # The bounds are for a bad one. `azure.archive.ubuntu.com` — the mirror the
        # runner image points at — stalled for hours around GitHub's 2026-08-17
        # incident: one leg reported `Fetched 102 MB in 24min 2s (70.7 kB/s)` against
        # the ~9 MB/s its siblings got, and another couldn't reach the mirror at all.
        # A bounded call plus one retry turns that into a fast, obvious failure that
        # `gh run rerun --failed` can pick up, rather than a job that sits until its
        # own timeout.
        #
        # …which stopped being enough on 2026-08-19: six jobs across three runs, every
        # one `exit 124` on that 120 s bound, and re-running never converged. In every
        # log the azure legs answer `Ign:` while `archive.ubuntu.com` — its sibling in
        # the same mirrorlist — answers `Hit:` throughout, so apt spends the whole
        # budget timing out on a mirror it does not need. Dropping the azure entry
        # sends it straight to the one that works. The bound and the retry stay: they
        # are what turns the NEXT bad mirror into a fast failure rather than a hang.
        timeout-minutes: 6
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          apt_try() {
            sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 update &&
            sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 \
                             install -y --no-install-recommends libvips42t64 ffmpeg
          }
          apt_try || { echo 'apt failed; retrying once' >&2; sleep 10; apt_try; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The native cascade accelerator (Rust). Compiled into lib/ before the specs: the gem's OWN
      # extension isn't built by `bundle install` (that only compiles it for downstream consumers),
      # so dev and CI build it explicitly. A broken build fails HERE — this step is the extension's
      # build gate.
      - uses: dtolnay/rust-toolchain@stable
      - run: bundle exec rake compile

      # Multi-process run (worker count = vCPUs). The WPT and capybara-shared
      # gates — the dominant cost centres — are sharded across spec/wpt_gate/
      # and spec/capybara_shared/ files precisely so they distribute here; a
      # serial `bundle exec rspec` remains equivalent. flatware balances its
      # per-worker buckets from the RSpec example-status file (see
      # spec/support/example_persistence.rb), carried across runs by the cache
      # step — a cold cache only costs round-robin balance for that run.
      - uses: actions/cache@v6
        with:
          path: tmp/rspec_examples_v8.txt
          key: rspec-examples-v8-${{ matrix.ruby }}-${{ github.sha }}
          restore-keys: rspec-examples-v8-${{ matrix.ruby }}-

      # `bin/ci-rspec`, not the bare runner: the suite, then ONE retry of the examples this run
      # itself reported as failures. The header on that script has the measurements, and — the part
      # that matters — what a retry is NOT allowed to re-check: a load error, a suite hook that
      # raised, or a dead worker leaves the red standing, however many examples also failed.
      - run: bin/ci-rspec spec

  # Secondary engine: QuickJS. It shares the JS bridge but has a distinct runtime
  # layer (value marshalling, no per-frame realms), so it needs its own coverage
  # to catch engine-specific regressions. The WPT gate (`:wpt`) is excluded: its
  # expected-failures allowlist is tuned to V8 (the conformance engine), and
  # QuickJS legitimately diverges on a handful of legacy-encoding / cross-realm
  # subtests. One Ruby suffices — the QuickJS-specific risk is in the engine
  # layer, not the (V8-matrix-covered) Ruby driver code.
  test-quickjs:
    runs-on: ubuntu-latest
    # QuickJS runs the same files ~2x slower than V8 (7-12 min), so it gets more
    # room than the V8 matrix — same reason for having a cap at all.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install libvips + ffmpeg
        # `--no-install-recommends` because most of the 102 MB apt otherwise fetches
        # is ffmpeg's recommends — a pocketsphinx speech model, OpenAL, JACK, the
        # Intel VA drivers — and none of it is what the specs decode with: the video
        # fixtures are h264 and vp9, both out of libavcodec60, which ffmpeg DEPENDS
        # on. It halves this step on a good day.
        #
        # The bounds are for a bad one. `azure.archive.ubuntu.com` — the mirror the
        # runner image points at — stalled for hours around GitHub's 2026-08-17
        # incident: one leg reported `Fetched 102 MB in 24min 2s (70.7 kB/s)` against
        # the ~9 MB/s its siblings got, and another couldn't reach the mirror at all.
        # A bounded call plus one retry turns that into a fast, obvious failure that
        # `gh run rerun --failed` can pick up, rather than a job that sits until its
        # own timeout.
        #
        # …which stopped being enough on 2026-08-19: six jobs across three runs, every
        # one `exit 124` on that 120 s bound, and re-running never converged. In every
        # log the azure legs answer `Ign:` while `archive.ubuntu.com` — its sibling in
        # the same mirrorlist — answers `Hit:` throughout, so apt spends the whole
        # budget timing out on a mirror it does not need. Dropping the azure entry
        # sends it straight to the one that works. The bound and the retry stay: they
        # are what turns the NEXT bad mirror into a fast failure rather than a hang.
        timeout-minutes: 6
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          apt_try() {
            sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 update &&
            sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 \
                             install -y --no-install-recommends libvips42t64 ffmpeg
          }
          apt_try || { echo 'apt failed; retrying once' >&2; sleep 10; apt_try; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # The native cascade accelerator (Rust) — see the V8 job. Built here too so the QuickJS
      # engine exercises the same code path.
      - uses: dtolnay/rust-toolchain@stable
      - run: bundle exec rake compile

      # Engine-specific cache: QuickJS runs the same files ~2x slower than V8,
      # so it balances from its own timing file.
      - uses: actions/cache@v6
        with:
          path: tmp/rspec_examples_quickjs.txt
          key: rspec-examples-quickjs-${{ github.sha }}
          restore-keys: rspec-examples-quickjs-

      # The tag filter reaches the workers via fork inheritance: flatware's
      # JobBuilder applies the rspec args to the global RSpec configuration
      # BEFORE forking (workers discard the args themselves).
      - run: bin/ci-rspec spec --tag '~wpt'
        env:
          CSIM_JS_ENGINE: quickjs

  # The gem SHIPS the pre-built bundles and never runs npm, so nothing in the spec
  # run can notice a bundle that no longer matches `vendor/src` / `js/src` — or a
  # `patches/` edit that was committed without rebuilding. Rebuild and diff.
  bundles:
    runs-on: ubuntu-latest
    # Seconds of work; anything near this is a hang.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm AND node in one step (the successor to pnpm/action-setup +
      # actions/setup-node; needs the pnpm v11+ that package.json's
      # `packageManager` pins). The version comes from that field rather than from
      # here — the bundles are compared byte for byte, so the builder has to be
      # pinned as well. `install: false` keeps the install its own explicit,
      # FROZEN step: this job means nothing if the deps aren't the locked ones.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: The checked-in bundles must match their sources
        run: git diff --exit-code vendor/js lib/capybara/simulated/js/bridge.bundle.js
