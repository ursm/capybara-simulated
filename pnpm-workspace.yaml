allowBuilds:
  esbuild: set this to true or false
minimumReleaseAgeExclude:
  # We own xpathway and pull each release immediately; exclude all versions so
  # the minimum-release-age gate doesn't block freshly-published bumps.
  - xpathway
patchedDependencies:
  css-select@7.0.0: patches/css-select@7.0.0.patch
  css-tree@3.2.1: patches/css-tree@3.2.1.patch
  css-what@8.0.0: patches/css-what@8.0.0.patch
