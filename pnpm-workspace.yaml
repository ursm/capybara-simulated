allowBuilds:
  # Answered so `pnpm install` doesn't fail with ERR_PNPM_IGNORED_BUILDS (and take
  # `pnpm run build`'s dependency check down with it). FALSE on purpose: esbuild's
  # install script overwrites its `bin/esbuild` JS shim with the raw platform
  # binary, which pnpm's `.bin` wrapper then feeds to node — the shim resolves
  # @esbuild/linux-x64 (a normal optional dependency) by itself.
  esbuild: false
